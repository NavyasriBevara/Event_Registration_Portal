{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-3">Register for: {{ event['name'] }}</h4>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input name="username" class="form-control" value="{{ session.get('user') }}" readonly>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input name="email" type="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Year</label>
            <select name="year" class="form-select" required>
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year">3rd Year</option>
              <option value="4th Year">4th Year</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Branch</label>
            <input name="branch" class="form-control" required>
          </div>

          <button class="btn btn-success w-100">Submit Registration</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
