{% extends "layout.html" %}
{% block content %}
<h3 class="mb-3">Available Events</h3>
<div class="row g-3">
  {% for e in events %}
  <div class="col-md-4">
    <div class="card h-100">
      <div class="card-body d-flex flex-column">
        <h5 class="card-title">{{ e['name'] }}</h5>
        <p class="card-text mb-1"><strong>Date:</strong> {{ e['date'] }}</p>
        <p class="card-text mb-1"><strong>Venue:</strong> {{ e['venue'] }}</p>
        <div class="mt-auto">
          <a href="{{ url_for('register_event', event_id=e['id']) }}" class="btn btn-primary w-100">Register</a>
        </div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
