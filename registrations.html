{% extends "layout.html" %}
{% block content %}
<h3>My Registrations</h3>
<table class="table table-striped">
  <thead><tr><th>#</th><th>Event</th><th>Email</th><th>Year</th><th>Branch</th><th>Date</th><th>Certificate</th></tr></thead>
  <tbody>
    {% for r in registrations %}
    <tr>
      <td>{{ r['id'] }}</td>
      <td>{{ r['event'] }}</td>
      <td>{{ r['email'] }}</td>
      <td>{{ r['year'] }}</td>
      <td>{{ r['branch'] }}</td>
      <td>{{ r['created_at'][:10] }}</td>
      <td><a class="btn btn-sm btn-outline-primary" href="{{ url_for('certificate', registration_id=r['id']) }}">Download</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
